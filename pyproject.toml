[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pcenginerecomp"
version = "0.1.0.dev0"
description = "An experimental bank-aware static recompilation toolkit for PC Engine"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md", "licenses/*.txt"]

[project.scripts]
pcerecomp = "pcerecomp.cli:main"

[tool.setuptools]
packages = ["pcerecomp"]
